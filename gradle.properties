# 启用 Gradle 守护进程，避免每次构建都启动新 JVM
org.gradle.daemon=true
# 启用并行构建，充分利用多核 CPU
org.gradle.parallel=true
# 启用构建缓存，复用之前的构建输出
org.gradle.caching=true
# 启用配置缓存 (Gradle 6.6+)，跳过配置阶段，极大提升后续构建速度
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
org.gradle.configureondemand=false

aiVersion=1.8.2
ashleyVersion=1.7.4
box2dlightsVersion=1.5
gdxControllersVersion=2.2.3
graalHelperVersion=2.0.1
enableGraalNative=false
